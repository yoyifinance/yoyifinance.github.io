<script>
var all=[],tag='';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'')}
function hay(e){return norm([e.term,e.en,e.one,e.metaphor,e.tip].concat(e.alias||[]).join(' '))}
function hl(s,q){s=esc(s);if(!q)return s;var r=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp('('+r+')','ig'),'<mark>$1</mark>')}
function score(e,q){
  if(!q)return 1;var n=norm(q),t=norm(e.term),en=norm(e.en);
  if(t===n||(e.alias||[]).some(function(a){return norm(a)===n}))return 100;
  if(t.indexOf(n)>=0||en.indexOf(n)>=0||(e.alias||[]).some(function(a){return norm(a).indexOf(n)>=0||n.indexOf(norm(a))>=0&&norm(a).length>=2}))return 50;
  if(hay(e).indexOf(n)>=0)return 10;return 0}
function render(){
  var q=document.getElementById('q').value.trim();
  var r=all.map(function(e){return {e:e,s:score(e,q)}}).filter(function(x){return x.s>0&&(!tag||x.e.tags.indexOf(tag)>=0)});
  r.sort(function(a,b){return b.s-a.s||(q?0:a.e.term.localeCompare(b.e.term,'zh-Hant'))});
  document.getElementById('cnt').textContent=q||tag?('找到 '+r.length+' 個名詞'):('共 '+all.length+' 個名詞，持續新增中');
  document.getElementById('list').innerHTML=r.length?r.map(function(x){var e=x.e;
    return '<details'+(q&&x.s>=50&&r.length<=3?' open':'')+'><summary><span class="t"><b>'+hl(e.term,q)+'</b><small>'+hl(e.en,q)+'</small><span class="one">'+hl(e.one,q)+'</span></span><span class="go">›</span></summary><div class="in">'+
    '<h4>🥬 生活比喻</h4><p>'+hl(e.metaphor,q)+'</p><div class="tip"><b>📌 記起來：</b>'+hl(e.tip,q)+'</div><div class="tg">'+e.tags.map(function(t){return '<i>'+esc(t)+'</i>'}).join('')+'</div></div></details>'}).join(''):
    '<p class="empty">找不到「'+esc(q)+'」😅<br>換個說法試試，或到 LINE 社群告訴我想學哪個名詞</p>'}
function chips(){
  var ts=[];all.forEach(function(e){e.tags.forEach(function(t){if(ts.indexOf(t)<0)ts.push(t)})});
  document.getElementById('chips').innerHTML=['全部'].concat(ts).map(function(t,i){return '<button data-t="'+(i?esc(t):'')+'" class="'+(i?'':'on')+'">'+esc(t)+'</button>'}).join('')}
document.getElementById('chips').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;tag=b.getAttribute('data-t');[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});render()};
document.getElementById('q').oninput=render;
fetch('glossary.json').then(function(r){return r.json()}).then(function(d){all=d;chips();render()}).catch(function(){document.getElementById('list').innerHTML='<p class="empty">載入失敗，請稍後再試</p>'});
</script>
