<script>
// 市場跑馬燈：加權、外資、台積電、費半、NASDAQ、台積電 ADR、美元／台幣、最強產業
(function(){
  var MK='https://raw.githubusercontent.com/yoyifinance/yoyifinance.github.io/data/market.json', bust='?t='+Math.floor(Date.now()/6e4);
  function n(v,d){return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
  function c(p){return p>0?'up':p<0?'dn':''}
  function p(v){return (v>0?'▲':v<0?'▼':'')+Math.abs(v).toFixed(2)+'%'}
  function it(name,val,pc){return '<span class="it"><b>'+name+'</b>'+val+(pc==null?'':' <span class="'+c(pc)+'">'+p(pc)+'</span>')+'</span>'}
  function find(a,s){for(var i=0;i<(a||[]).length;i++)if(a[i].symbol===s)return a[i]}
  fetch(MK+bust).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return fetch('market.json'+bust).then(function(r){return r.json()})})
  .then(function(M){
    var h='', x=M.tw.index, I=M.tw.inst, S=M.tw.sectors;
    if(x)h+=it('加權指數',n(x.price,0),x.pct);
    if(I)h+='<span class="it"><b>外資</b><span class="'+c(I.foreign)+'">'+(I.foreign>=0?'買超 ':'賣超 ')+n(Math.abs(I.foreign),0)+' 億</span></span>';
    [['台積電',find(M.chain.tw,'2330.TW'),0],['費半',find(M.us,'^SOX'),0],['NASDAQ',find(M.us,'^IXIC'),0],['台積電 ADR',find(M.cross,'TSM'),2],['美元／台幣',find(M.cross,'TWD=X'),2]]
      .forEach(function(a){if(a[1])h+=it(a[0],n(a[1].price,a[2]),a[1].pct)});
    if(S&&S.items.length){var s=S.items[0];h+='<span class="it"><b>強勢產業</b><span class="'+c(s[1])+'">'+s[0]+' '+p(s[1])+'</span></span>'}
    if(!h)return;
    document.getElementById('run').innerHTML=h+h;
    document.getElementById('tick').hidden=false;document.getElementById('rule').hidden=true;
  }).catch(function(){});
})();
</script>
